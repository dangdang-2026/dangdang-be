# 서버(운영)용: cd.yml이 이 파일을 서버 ~/dangdang/docker/ 로 복사해서 실행
services:
  app:
    image: ${DOCKER_REPO}:latest
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      REDIS_HOST: redis
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
  dozzle:
    image: amir20/dozzle:latest
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    ports: ["127.0.0.1:9999:8080"]
    restart: unless-stopped
  ai:
    image: dahyun0423/dangdang-ai:latest
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    volumes: [ "../ai-models:/app/models:ro" ]
    mem_limit: 1g
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  pgdata:
