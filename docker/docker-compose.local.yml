# 로컬 개발용: DB·Redis만 띄우고 Spring은 IntelliJ/bootRun으로 실행
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dangdang
      POSTGRES_USER: dangdang
      POSTGRES_PASSWORD: dangdang
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dangdang -d dangdang"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
