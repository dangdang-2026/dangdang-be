name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:              # main 머지가 연달아 와도 배포는 한 번에 하나씩 (두 배포가 동시에 색을 바꾸면 꼬임)
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REPO }}:latest
            ${{ secrets.DOCKER_REPO }}:${{ github.sha }}

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker/docker-compose.yml,docker/deploy.sh   # deploy.sh = 블루그린 전환 스크립트
          target: ~/dangdang

      - uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PULL_TOKEN: ${{ secrets.DOCKER_PULL_TOKEN }}   # 서버엔 읽기 전용 토큰만 남긴다 (빌드·푸시는 위 DOCKER_PASSWORD)
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ENV_PROD,DOCKER_USERNAME,DOCKER_PULL_TOKEN   # Secret을 스크립트 글자에 끼우지 않고 환경변수로 넘김 ($·백틱이 셸에서 바뀌지 않게)
          script: |
            set -e
            cd ~/dangdang/docker
            printf '%s\n' "$ENV_PROD" > .env
            chmod 600 .env
            printf '%s' "$DOCKER_PULL_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
            bash deploy.sh   # 쉬던 색 띄우기 → 건강 확인 → Nginx 전환 → 이전 색 끄기 (실패하면 이전 색 그대로)
