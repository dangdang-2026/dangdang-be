spring:
  application:
    name: dangdang-be
  lifecycle:
    timeout-per-shutdown-phase: 30s              # ★ 블루그린: 끌 때 하던 요청을 최대 30초까지 마저 처리 (compose stop_grace_period 40s보다 짧게)
  config:
    import: optional:file:.env[.properties]
  task:
    scheduling:
      pool:
        size: 2                                  # @Scheduled 스레드 (기본 1) — 알림 스케줄러가 오래 걸려도 SSE ping(25초)이 밀려 끊기지 않게
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dangdang}
    username: ${DB_USER:dangdang}
    password: ${DB_PASSWORD:dangdang}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:                                   # 음식 사진 AI 분석 (기본값 1MB라서 올림)
      max-file-size: 10MB                        # AI 서버가 받는 최대 크기
      max-request-size: 12MB                     # multipart 포장 몫만큼 여유 (Nginx client_max_body_size 12m과 같음)
      file-size-threshold: 10MB                  # 이 크기까지는 디스크 임시 파일 없이 메모리에서만 처리 (기본 0B면 사진을 매번 work/tmp에 씀)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:                                          # ← data 와 같은 2칸
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  shutdown: graceful                             # ★ 블루그린: 끄라는 신호를 받으면 새 요청은 안 받고, 하던 요청은 끝낸 뒤 꺼짐
  tomcat:
    # 업로드 한도를 넘은 요청에서 Tomcat이 남은 본문을 읽고 버릴 최대 양 (기본 2MB)
    # 2MB를 넘게 남으면 413 응답 대신 연결을 끊어서, Nginx(12m)를 안 거친 요청(로컬 등)은 네트워크 오류가 남
    # 운영은 Nginx가 12m에서 먼저 막고, 그보다 큰 요청을 앱까지 받지 않게 20MB로 둠
    max-swallow-size: 20MB

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:local-only-secret-dangdang-change-in-prod-0123456789}
  access-token-validity-in-seconds: 1800        # 30분
  refresh-token-validity-in-seconds: 1209600    # 14일 = 60*60*24*14
  secure: ${JWT_COOKIE_SECURE:false}            # 로컬은 http라 false
  same-site: Lax

mail:                                            # ← 맨 앞 0칸
  sender: ${MAIL_SENDER:log}                    # log = 콘솔에 찍기(로컬) / smtp = 진짜 메일

push:
  sender: ${PUSH_SENDER:log}                    # log = 콘솔에 찍기(로컬·테스트) / webpush = 진짜 발송

vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:}

card-image:
  storage: ${CARD_IMAGE_STORAGE:off}             # off = 카드 이미지 올리기 막음(로컬·테스트) / s3 = 진짜 S3
s3:                                              # 키는 AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY 환경 변수로 (여기 안 씀)
  bucket: ${S3_BUCKET:}
  region: ${S3_REGION:ap-northeast-2}
  public-base-url: ${S3_PUBLIC_BASE_URL:}        # 비우면 https://{bucket}.s3.{region}.amazonaws.com

front:
  base-url: ${FRONT_BASE_URL:http://localhost:5173}   # 메일 속 링크가 열 프론트 주소
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}   # API 를 불러도 되는 프론트 주소 (쉼표로 여러 개)
  admin-allowed-origins: ${CORS_ADMIN_ALLOWED_ORIGINS:http://localhost:5180,http://127.0.0.1:5180}   # 운영자 화면 주소. 배포하지 않고 운영진 PC에서만 띄운다
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}   # AI 서버 주소 (운영은 docker-compose가 http://ai:8000)
  internal-token: ${INTERNAL_TOKEN:}            # AI 서버와 같은 값 (.env)
kakao:
  client-id: ${KAKAO_REST_API_KEY:}             # 카카오 REST API 키 (.env에 있는 이름 그대로)
  client-secret: ${KAKAO_CLIENT_SECRET:}        # 카카오 클라이언트 시크릿
  redirect-uris:                                # 카카오 콘솔에 등록한 주소와 똑같이
    - http://localhost:5173/auth/kakao/callback
    - https://dang-dang.site/auth/kakao/callback
    - https://dang-dang.vercel.app/auth/kakao/callback
hira:
  service-key: ${HIRA_SERVICE_KEY:}             # 공공데이터포털 심평원 병원정보서비스 일반 인증키 (병원 검색용)
  sync-enabled: ${HIRA_SYNC_ENABLED:false}      # 병원 목록 DB 적재(처음 한 번 + 매주 일 04:30). 서버만 true
